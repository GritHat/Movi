<rect x="986" y="306" width="236" height="262" fill="white" stroke="black" stroke-width="1"/>
<text x="992" y="320" font-size="11" font-weight="bold">Legenda minima</text>
<circle cx="1008" cy="340" r="6" fill="black"/>
<text x="1032" y="341" font-size="10">osservato: visto in questo ciclo</text>
<text x="1032" y="352" font-size="9">disco pieno, scia a linea piena</text>
<circle cx="1008" cy="374" r="6" fill="white" stroke="black" stroke-width="2"/>
<text x="1032" y="375" font-size="10">previsto: posizione più probabile</text>
<text x="1032" y="386" font-size="9">anello vuoto, scia tratteggiata, età</text>
<rect x="994" y="398" width="30" height="20" fill="url(#contro)" stroke="black" stroke-width="1.6" stroke-dasharray="5 3"/>
<rect x="1003" y="403" width="12" height="10" fill="url(#fitte)" stroke="black" stroke-width="0.8" stroke-dasharray="2 2"/>
<text x="1032" y="407" font-size="10">dove può essere: 9 volte su 10</text>
<text x="1032" y="418" font-size="9">(righe fitte: 1 su 2). NON è la taglia</text>
<rect x="994" y="434" width="30" height="20" fill="url(#rade)" stroke="black" stroke-width="0.8"/>
<text x="1032" y="443" font-size="10">possibile presenza: tutta l'ombra</text>
<text x="1032" y="454" font-size="9">resta finché non lo si rivede</text>
<rect x="994" y="470" width="30" height="20" fill="url(#contro)" stroke="black" stroke-width="2.4" stroke-dasharray="1.5 4.5" stroke-linecap="round"/>
<path d="M1002,480 h14 M1009,473 v14" stroke="black" stroke-width="2" fill="none"/>
<text x="1032" y="479" font-size="10">previsione larga (oltre soglia):</text>
<text x="1032" y="490" font-size="9">bordo a punti, croce al posto dell'anello</text>
<line x1="994" y1="516" x2="1024" y2="516" stroke="black" stroke-width="1"/>
<path d="M994,512 v8 M1024,512 v8" stroke="black" stroke-width="1"/>
<text x="1032" y="515" font-size="10">scarto alla ricomparsa: fra il punto</text>
<text x="1032" y="526" font-size="9">previsto e la prima misura</text>
<text x="994" y="546" font-size="9">Disco, anello e croce hanno taglia fissa:</text>
<text x="994" y="557" font-size="9">la taglia non dice mai l'incertezza.</text>
<text x="10" y="608" font-size="10">Posizioni e raggi dal modello di punto_mostrato.py (geometria della demo, 1,1 m/s, q = 0,2 m²/s³): è un disegno di progetto, non una misura.</text>
<text x="10" y="622" font-size="10">La regione è l'insieme di massima densità della previsione troncata all'ombra: dove il sensore vede suolo libero la regione è tagliata dal bordo dell'ombra.</text>
</svg>