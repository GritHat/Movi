<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face { font-family: "JBMonoLocale"; src: url("assets/fonts/JetBrainsMono-Regular.woff2") format("woff2"); }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b0f14; }
      #root { position: relative; width: 1920px; height: 1080px; }
      #cv { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-no-timeline data-width="1920" data-height="1080" data-fps="30">
      <canvas id="cv" class="clip" data-start="0" data-duration="3" data-track-index="1" width="1920" height="1080"></canvas>
    </div>
    <script>
      // Variante senza GSAP: protocollo hf-seek + canvas 2D; dati letti con fetch di un file locale.
      const ctx = document.getElementById("cv").getContext("2d");
      let S = null;
      function renderAt(t) {
        ctx.fillStyle = "#0b0f14"; ctx.fillRect(0, 0, 1920, 1080);
        if (!S) return;
        const fr = S.frames[Math.min(S.n - 1, Math.max(0, Math.floor(t * S.fps + 1e-6)))];
        ctx.save(); ctx.scale(1.8, 1.8); ctx.lineWidth = 2; ctx.strokeStyle = "#4cc2ff"; ctx.fillStyle = "#e8eef5"; ctx.font = "16px JBMonoLocale";
        for (const o of fr.objs) { ctx.beginPath(); o.poly.forEach(([x, y], k) => (k ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath(); ctx.stroke(); ctx.fillText(o.label, o.x + 44, o.y - 20); }
        ctx.fillStyle = "#ffb347"; ctx.fillText("frame " + String(fr.f).padStart(3, "0"), 20, 30); ctx.restore();
      }
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["dati"] = Promise.all([fetch("assets/data/stati.json").then((r) => r.json()), document.fonts.load("16px JBMonoLocale")]).then(([d]) => { S = d; renderAt(0); });
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
    </script>
  </body>
</html>
