<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/data/stati.js"></script>
    <style>
      @font-face { font-family: "InterLocale"; src: url("assets/fonts/InterVariable.woff2") format("woff2"); font-weight: 100 900; font-style: normal; }
      @font-face { font-family: "JBMonoLocale"; src: url("assets/fonts/JetBrainsMono-Regular.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "JBMonoLocale"; src: url("assets/fonts/JetBrainsMono-Bold.woff2") format("woff2"); font-weight: 700; }
      :root { --ground: #0b0f14; --ink: #e8eef5; --accent: #4cc2ff; --warn: #ffb347; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1920px; height: 1080px; font-family: "InterLocale", sans-serif; color: var(--ink); }
      #bg { position: absolute; inset: 0; background: radial-gradient(1200px 700px at 30% 20%, #16202c, #0b0f14); }
      #title { position: absolute; left: 140px; top: 130px; width: 1200px; height: 110px; }
      #title-in { font-size: 88px; font-weight: 700; letter-spacing: -0.03em; }
      #sub { position: absolute; left: 144px; top: 250px; width: 1200px; height: 50px; }
      #sub-in { font-family: "JBMonoLocale", monospace; font-size: 34px; color: var(--accent); }
      #shape { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #data { position: absolute; left: 140px; top: 420px; width: 1000px; height: 480px; }
      #data svg { width: 1000px; height: 480px; background: #101821; border: 2px solid #24384d; }
      #data text { font-family: "JBMonoLocale", monospace; font-size: 20px; fill: var(--ink); }
      #hud { position: absolute; left: 1200px; top: 420px; width: 600px; height: 60px; }
      #hud-in { font-family: "JBMonoLocale", monospace; font-weight: 700; font-size: 36px; color: var(--warn); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080" data-fps="30">
      <div id="bg"></div>
      <div id="title" class="clip" data-start="0" data-duration="30" data-track-index="1"><div id="title-in">Deterministic motion test</div></div>
      <div id="sub" class="clip" data-start="0.4" data-duration="29.6" data-track-index="2"><div id="sub-in">1920x1080 @ 30 fps / Inter + JetBrains Mono</div></div>
      <div id="shape" class="clip" data-start="0" data-duration="30" data-track-index="3" data-layout-ignore>
        <svg width="1920" height="1080" viewBox="0 0 1920 1080">
          <path d="M1300 950 C 1500 700, 1700 900, 1800 620" fill="none" stroke="#24384d" stroke-width="3" stroke-dasharray="8 10" />
          <g id="hex"><polygon points="0,-46 40,-23 40,23 0,46 -40,23 -40,-23" fill="none" stroke="#4cc2ff" stroke-width="6" /><circle r="8" fill="#ffb347" /></g>
        </svg>
      </div>
      <div id="data" class="clip" data-start="0" data-duration="30" data-track-index="4">
        <svg viewBox="0 0 1000 480"><g id="objs"></g></svg>
      </div>
      <div id="hud" class="clip" data-start="0" data-duration="30" data-track-index="5"><div id="hud-in">frame 000</div></div>
      <audio id="tono" class="clip" src="assets/audio/tono.wav" data-start="0" data-duration="6" data-track-index="6" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title-in", { opacity: 0, y: 40, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 0.1);
      tl.fromTo("#sub-in", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.5);
      tl.fromTo("#hex", { x: 1300, y: 950, rotation: 0, transformOrigin: "50% 50%" }, { x: 1800, y: 620, rotation: 360, duration: 29.6, ease: "sine.inOut" }, 0.2);

      // Disegno guidato dai dati: lo stato del fotogramma e' funzione del solo tempo.
      const S = window.__STATI, NS = "http://www.w3.org/2000/svg", layer = document.getElementById("objs"), hud = document.getElementById("hud-in");
      const nodes = new Map();
      function node(id) {
        if (!nodes.has(id)) {
          const g = document.createElementNS(NS, "g"), p = document.createElementNS(NS, "polygon"), tx = document.createElementNS(NS, "text");
          p.setAttribute("fill", "rgba(76,194,255,0.18)"); p.setAttribute("stroke", "#4cc2ff"); p.setAttribute("stroke-width", "3");
          g.append(p, tx); layer.append(g); nodes.set(id, { g, p, tx });
        }
        return nodes.get(id);
      }
      function drawAt(t) {
        const i = Math.min(S.n - 1, Math.max(0, Math.floor(t * S.fps + 1e-6))), fr = S.frames[i], seen = new Set();
        for (const o of fr.objs) {
          const n = node(o.id); seen.add(o.id);
          n.g.style.display = ""; n.p.setAttribute("points", o.poly.map((q) => q.join(",")).join(" "));
          n.tx.setAttribute("x", o.x + 44); n.tx.setAttribute("y", o.y - 24); n.tx.textContent = o.label;
        }
        for (const [id, n] of nodes) if (!seen.has(id)) n.g.style.display = "none";
        hud.textContent = "frame " + String(fr.f).padStart(3, "0");
      }
      const clock = { t: 0 };
      tl.to(clock, { t: 30, duration: 30, ease: "none", onUpdate: () => drawAt(clock.t) }, 0);
      drawAt(0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
