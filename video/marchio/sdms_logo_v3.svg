<title id="t">SDMs, logo</title>
<desc id="d">Un disco pieno (ciò che si vede) e, accanto, una zona tratteggiata vuota (ciò che non si vede, ma resta segnato). Versione 3: tolto l'anello interno, perché i cerchi concentrici ricordavano un bersaglio. A destra la parola SDMs in Inter SemiBold, convertita in tracciati.</desc>
