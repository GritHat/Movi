<!doctype html>
<!-- MoVi pitch v4, CAMPIONE di stile (62 s). Stile chiaro, illustrazioni vettoriali. Tutto ciò che si vede è un'illustrazione; le cifre vengono da video/consegna/MoVi_registro_cifre_final.md -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>MoVi v4 sample</title>
<style>
  @font-face { font-family: "InterLocale"; src: url("assets/fonts/InterVariable.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; padding: 0; background: #F7FAFE; width: 1920px; height: 1080px; overflow: hidden; }
  svg { display: block; font-family: "InterLocale", sans-serif; }
  text { font-family: "InterLocale", sans-serif; }
</style>
<script src="assets/vendor/gsap.min.js"></script>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="62" data-width="1920" data-height="1080" data-fps="24">
<div id="tela" class="clip" data-start="0" data-duration="62">
<svg id="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFE4FB"/><stop offset="1" stop-color="#F7FAFE"/></linearGradient>
  <linearGradient id="space" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9E6FB"/><stop offset="1" stop-color="#F7FAFE"/></linearGradient>
  <radialGradient id="reg"><stop offset="0" stop-color="#1F6FEB" stop-opacity=".30"/><stop offset="1" stop-color="#1F6FEB" stop-opacity=".10"/></radialGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B1F3A" flood-opacity=".14"/></filter>
  <filter id="bl"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1920" height="1080" fill="#F7FAFE"/>
<g id="stage"></g>
<text x="60" y="1048" font-size="22" font-weight="500" fill="#5B6B82" letter-spacing="1.5">SIMULATED PROTOTYPE · ILLUSTRATION</text>
</svg>
</div>
</div>
<script>
const INK="#0B1F3A", BLUE="#1F6FEB", TEAL="#00A389", AMB="#FF8A1F", RED="#E5484D", GREY="#5B6B82";
let seed=7; const rnd=()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296;};
const drone=(c)=>`<g fill="${c}"><rect x="-46" y="-14" width="92" height="30" rx="14"/><rect x="-82" y="-12" width="164" height="8" rx="4"/><rect x="-82" y="-26" width="7" height="18" rx="3"/><rect x="75" y="-26" width="7" height="18" rx="3"/><ellipse cx="-78" cy="-28" rx="36" ry="4.5" opacity=".5"/><ellipse cx="78" cy="-28" rx="36" ry="4.5" opacity=".5"/><rect x="-30" y="14" width="5" height="14" rx="2"/><rect x="25" y="14" width="5" height="14" rx="2"/><circle cx="24" cy="1" r="7" fill="#fff"/></g>`;
const jet=(c)=>`<g fill="${c}"><path d="M-95,0 L-30,-13 L60,-9 L105,0 L60,9 L-30,13 Z"/><path d="M-5,-6 L-60,-58 L-34,-58 L40,-6 Z"/><path d="M-5,6 L-60,58 L-34,58 L40,6 Z"/><path d="M-95,0 L-112,-26 L-96,-26 L-70,-4 Z"/><path d="M-95,0 L-112,26 L-96,26 L-70,4 Z"/></g>`;
const cloud=(id,x,y,s)=>`<g id="${id}" transform="translate(${x},${y}) scale(${s})"><g fill="#fff" filter="url(#sh)"><ellipse cx="0" cy="0" rx="210" ry="70"/><circle cx="-90" cy="-45" r="70"/><circle cx="10" cy="-80" r="95"/><circle cx="110" cy="-40" r="65"/></g></g>`;
const pill=(id,x,y,w,txt,c)=>`<g id="${id}" transform="translate(${x},${y})"><rect width="${w}" height="74" rx="37" fill="#fff" filter="url(#sh)"/><circle cx="38" cy="37" r="11" fill="${c}"/><text x="64" y="48" font-size="30" font-weight="600" fill="${INK}">${txt}</text></g>`;
const person=(c)=>`<g fill="${c}"><circle cx="0" cy="-88" r="17"/><rect x="-17" y="-66" width="34" height="62" rx="14"/><rect x="-15" y="-12" width="12" height="52" rx="6"/><rect x="3" y="-12" width="12" height="52" rx="6"/></g>`;
const car=(c)=>`<g><path fill="${c}" d="M-130,10 Q-130,-22 -96,-26 L-62,-62 Q-54,-70 -40,-70 L48,-70 Q62,-70 72,-60 L100,-28 Q134,-22 134,6 L134,22 Q134,30 126,30 L-122,30 Q-130,30 -130,22 Z"/><path fill="#DCEBFB" d="M-52,-58 L-8,-58 L-8,-28 L-80,-28 Z M4,-58 L46,-58 Q54,-58 60,-52 L82,-28 L4,-28 Z"/><circle cx="-78" cy="32" r="24" fill="${INK}"/><circle cx="82" cy="32" r="24" fill="${INK}"/><circle cx="-78" cy="32" r="10" fill="#fff"/><circle cx="82" cy="32" r="10" fill="#fff"/></g>`;
const region=(id,x,y,rx,ry)=>`<g id="${id}" transform="translate(${x},${y})"><ellipse rx="${rx}" ry="${ry}" fill="url(#reg)"/><ellipse rx="${rx}" ry="${ry}" fill="none" stroke="${BLUE}" stroke-width="5" stroke-dasharray="18 12"/></g>`;
const chip=(id,x,y,txt,c,w)=>`<g id="${id}" transform="translate(${x},${y})"><rect width="${w}" height="60" rx="14" fill="${c}"/><text x="${w/2}" y="41" text-anchor="middle" font-size="28" font-weight="700" fill="#fff" letter-spacing=".5">${txt}</text></g>`;
const caps=[]; const cap=(t0,t1,txt)=>{caps.push([t0,t1]);return `<text id="cap${caps.length-1}" x="960" y="975" text-anchor="middle" font-size="46" font-weight="600" fill="${INK}">${txt}</text>`;};
const head=(id,x,y,l1,l2,size)=>`<g id="${id}"><text x="${x}" y="${y}" font-size="${size}" font-weight="800" fill="${INK}" letter-spacing="-2">${l1}</text><text x="${x}" y="${y+size*1.1}" font-size="${size}" font-weight="800" fill="${BLUE}" letter-spacing="-2">${l2}</text></g>`;

let H="";
// ---------- cielo comune (0-36)
H+=`<g id="gSky"><rect width="1920" height="1080" fill="url(#sky)"/>${cloud("cl1",300,300,0.7)}${cloud("cl2",1500,820,0.9)}${cloud("cl3",2300,220,0.6)}</g>`;
// ---------- A aggancio + B idea (0-14)
H+=`<g id="gA"><g id="aDrone">${drone(INK)}</g>${region("aReg",1180,560,150,110)}${cloud("aCloud",2500,600,1.5)}
${head("aHead",120,220,"What you stop seeing","is still there.",104)}
${head("bHead",120,200,"MoVi keeps track of","what it can no longer see.",84)}
<text id="aRegT" x="1180" y="330" text-anchor="middle" font-size="34" font-weight="700" fill="${BLUE}">it can be anywhere in here</text>
${pill("p1",120,440,520,"Declares where it can be",BLUE)}${pill("p2",120,540,560,"Confidence fades with time",TEAL)}${pill("p3",120,640,640,"Never says “clear” without looking",AMB)}
${cap(0.6,6.6,"A drone flies into a cloud. Most systems simply forget it.")}${cap(7.4,13.6,"MoVi observes and warns — honestly.")}</g>`;
// ---------- H scena eroe (14-36)
let smoke="",deb="",fire="";
for(let i=0;i<16;i++){const a=rnd()*6.28,r=60+rnd()*330;smoke+=`<circle class="smk" data-x="${(Math.cos(a)*r*1.25).toFixed(0)}" data-y="${(Math.sin(a)*r*0.7).toFixed(0)}" data-s="${(1.2+rnd()*1.6).toFixed(2)}" r="95" fill="${i%3?'#8D99AB':'#6B778A'}"/>`;}
for(let i=0;i<9;i++){const a=rnd()*6.28,r=30+rnd()*120;fire+=`<circle class="fir" data-x="${(Math.cos(a)*r).toFixed(0)}" data-y="${(Math.sin(a)*r).toFixed(0)}" r="${(50+rnd()*50).toFixed(0)}" fill="${i%2?'#FFB020':'#FF6A1A'}"/>`;}
for(let i=0;i<18;i++){const a=i/18*6.28+rnd()*0.3,r=380+rnd()*420;deb+=`<path class="deb" data-x="${(Math.cos(a)*r).toFixed(0)}" data-y="${(Math.sin(a)*r*0.75).toFixed(0)}" data-r="${(rnd()*500-250).toFixed(0)}" d="M-14,-8 L12,-12 L16,6 L-6,13 Z" fill="${INK}"/>`;}
H+=`<g id="gH"><g id="spd">${[0,1,2,3,4,5,6].map(i=>`<rect x="${200+i*260}" y="${140+((i*197)%700)}" width="${180+i*20}" height="6" rx="3" fill="#fff" opacity=".9"/>`).join("")}</g>
<line id="sight" x1="560" y1="740" x2="1390" y2="340" stroke="${BLUE}" stroke-width="5" stroke-dasharray="4 18" stroke-linecap="round"/>
${region("hReg",1440,320,170,120)}
<g id="hJet" transform="translate(1440,320)">${jet(INK)}</g>
<g id="d1">${drone("#34506F")}</g><g id="d2">${drone("#34506F")}</g>
<g id="boom" transform="translate(1000,540)"><g id="debs">${deb}</g><g id="fires">${fire}</g><g id="smokes" opacity=".93">${smoke}</g><circle id="flash" r="120" fill="#fff"/></g>
<g id="frag" transform="translate(1000,540)"><path d="M-22,-12 L18,-18 L24,10 L-10,20 Z" fill="${RED}"/></g>
<g id="hCar" transform="translate(480,780)"><circle id="ring" r="120" fill="none" stroke="${AMB}" stroke-width="10"/>${drone(BLUE)}</g>
<text id="hRegT" x="1440" y="150" text-anchor="middle" font-size="36" font-weight="700" fill="${BLUE}">MoVi: the target is in here</text>
${chip("cCam",120,90,"CAMERAS  ·  BLINDED",GREY,400)}${chip("cRad",540,90,"RADAR  ·  BLINDED",GREY,360)}
${chip("cWarn",250,590,"WARNING SENT",AMB,300)}
<g id="tscale" transform="translate(1500,930)"><rect width="340" height="92" rx="46" fill="${INK}"/><circle cx="50" cy="46" r="20" fill="none" stroke="#fff" stroke-width="5"/><path d="M50,34 L50,46 L59,52" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/><text x="88" y="60" font-size="40" font-weight="800" fill="#fff">time ×0.1</text></g>
<g id="hStats"><rect width="1920" height="1080" fill="#F7FAFE" opacity=".93"/>
 <text x="960" y="170" text-anchor="middle" font-size="34" font-weight="700" fill="${GREY}" letter-spacing="3">SENSORS BLINDED BY THE EXPLOSION · SIMULATED RUNS</text>
 <g id="st1"><text x="520" y="470" text-anchor="middle" font-size="230" font-weight="800" fill="${BLUE}" letter-spacing="-6">59<tspan fill="${INK}" font-size="120"> of 59</tspan></text><text x="520" y="560" text-anchor="middle" font-size="38" font-weight="600" fill="${INK}">carrier warned before the first fragment</text><text x="520" y="612" text-anchor="middle" font-size="28" font-weight="600" fill="${TEAL}">promising result · correction under test</text></g>
 <g id="st2"><text x="1400" y="470" text-anchor="middle" font-size="230" font-weight="800" fill="${BLUE}" letter-spacing="-6">60<tspan fill="${INK}" font-size="120"> of 60</tspan></text><text x="1400" y="560" text-anchor="middle" font-size="38" font-weight="600" fill="${INK}">target region kept through the smoke</text><text x="1400" y="612" text-anchor="middle" font-size="28" font-weight="600" fill="${TEAL}">never called “clear” where the drone or a fragment was</text></g></g>
${cap(14.4,17.8,"A drone follows a fast object.")}${cap(18.4,22.4,"Next to it, two drones collide: fire, smoke, debris.")}${cap(22.8,28.6,"MoVi keeps the target’s region — and warns at once.")}${cap(29.2,35.6,"It never calls “clear” what it has not observed.")}</g>`;
// ---------- I infografica (36-46)
const card=(id,x,big,l1,l2,c)=>`<g id="${id}" transform="translate(${x},330)"><rect width="410" height="440" rx="36" fill="#fff" filter="url(#sh)"/><rect width="410" height="14" rx="7" fill="${c}"/><text x="205" y="190" text-anchor="middle" font-size="120" font-weight="800" fill="${c}" letter-spacing="-4">${big}</text><text x="205" y="290" text-anchor="middle" font-size="34" font-weight="700" fill="${INK}">${l1}</text><text x="205" y="340" text-anchor="middle" font-size="26" font-weight="500" fill="${GREY}">${l2}</text></g>`;
H+=`<g id="gI"><rect width="1920" height="1080" fill="#F7FAFE"/>${head("iHead",120,150,"Built on evidence,","not on promises.",76)}
${card("k1",110,"100+","pages of technical report","proofs and test results",BLUE)}${card("k2",540,"400+","references studied","literature · maths · experiments",TEAL)}${card("k3",970,"60/60","sensor failure declared","within 1 second · simulated",AMB)}${card("k4",1400,"200/200","warned in time","long range · simulated",INK)}
${cap(36.6,45.6,"Every number comes from the technical report.")}</g>`;
// ---------- S scenari (46-58)
const tag=`<g transform="translate(120,90)"><rect width="430" height="60" rx="30" fill="${INK}"/><text x="215" y="41" text-anchor="middle" font-size="26" font-weight="700" fill="#fff" letter-spacing="3">POSSIBLE APPLICATION</text></g>`;
H+=`<g id="gS1"><rect width="1920" height="1080" fill="#F2F7FD"/><rect y="700" width="1920" height="250" fill="#DDE6F0"/><g fill="#fff">${[0,1,2,3,4,5,6,7].map(i=>`<rect x="${60+i*250}" y="818" width="130" height="12" rx="6"/>`).join("")}</g>
${tag}${head("s1Head",120,270,"The pedestrian behind","the parked van.",76)}
${region("s1Reg",1330,640,150,150)}<g id="s1Ped" transform="translate(1330,650)">${person(TEAL)}</g>
<g transform="translate(1130,600)"><rect x="-190" y="-170" width="380" height="250" rx="26" fill="#9FB3C8"/><rect x="-170" y="-150" width="120" height="90" rx="12" fill="#DCEBFB"/><circle cx="-110" cy="84" r="32" fill="${INK}"/><circle cx="110" cy="84" r="32" fill="${INK}"/></g>
<g id="s1Car">${car(BLUE)}<g id="s1W" transform="translate(0,-130)"><circle r="40" fill="${AMB}"/><text y="18" text-anchor="middle" font-size="54" font-weight="800" fill="#fff">!</text></g></g></g>`;
H+=`<g id="gS2"><rect width="1920" height="1080" fill="#F2FBF8"/><rect y="760" width="1920" height="220" fill="#DDE6F0"/><g fill="#fff">${[0,1,2,3,4,5].map(i=>`<rect x="${1010+i*74}" y="770" width="44" height="200" rx="6"/>`).join("")}</g>
<rect x="1420" y="250" width="500" height="510" fill="#C9D6E4"/><g fill="#fff">${[0,1,2,3,4,5].map(i=>`<rect x="${1480+(i%3)*130}" y="${320+Math.floor(i/3)*170}" width="80" height="100" rx="8"/>`).join("")}</g>
${tag}${head("s2Head",120,270,"A blind person warned","of the car they cannot hear.",72)}
${region("s2Reg",1560,860,190,90)}<g id="s2Car" transform="translate(2100,850) scale(-1,1)">${car("#34506F")}</g>
<g id="s2P" transform="translate(900,800)">${person(INK)}<line x1="14" y1="-40" x2="90" y2="42" stroke="${INK}" stroke-width="7" stroke-linecap="round"/><circle id="s2R" cx="0" cy="-40" r="60" fill="none" stroke="${AMB}" stroke-width="9"/></g></g>`;
let sdeb="";for(let i=0;i<26;i++){sdeb+=`<path transform="translate(${(1050+rnd()*700).toFixed(0)},${(300+rnd()*520).toFixed(0)}) rotate(${(rnd()*360).toFixed(0)}) scale(${(0.6+rnd()*1.2).toFixed(2)})" d="M-14,-8 L12,-12 L16,6 L-6,13 Z" fill="#9AA5B8"/>`;}
H+=`<g id="gS3"><rect width="1920" height="1080" fill="url(#space)"/><circle cx="260" cy="1500" r="760" fill="#CFE4FB"/><circle cx="260" cy="1500" r="700" fill="#B5D3F5"/>
${tag}${head("s3Head",120,270,"A satellite that spots the","dangerous fragment in the cloud.",68)}
<g id="s3Deb">${sdeb}</g>${region("s3Reg",1380,560,120,120)}<path id="s3F" transform="translate(1380,560)" d="M-22,-12 L18,-18 L24,10 L-10,20 Z" fill="${RED}"/>
<g id="s3Sat" transform="translate(640,640) rotate(-12)"><rect x="-60" y="-45" width="120" height="90" rx="14" fill="${INK}"/><rect x="-250" y="-34" width="170" height="68" rx="8" fill="${BLUE}"/><rect x="80" y="-34" width="170" height="68" rx="8" fill="${BLUE}"/><rect x="-80" y="-5" width="20" height="10" fill="${INK}"/><rect x="60" y="-5" width="20" height="10" fill="${INK}"/><circle cx="0" cy="-66" r="22" fill="none" stroke="${INK}" stroke-width="8"/><circle id="s3R" r="90" fill="none" stroke="${AMB}" stroke-width="9"/></g></g>`;
// ---------- chiusura (58-62)
H+=`<g id="gEnd"><rect width="1920" height="1080" fill="#F7FAFE"/><image id="eLogo" href="assets/marchio/movi_wordmark_mono_scuro.svg" x="660" y="250" width="600" height="250"/>
<text id="eT1" x="960" y="610" text-anchor="middle" font-size="56" font-weight="700" fill="${INK}">It keeps track of what it stops seeing.</text>
<g id="eT2"><image href="assets/marchio/sdms_logo_mono_scuro.svg" x="810" y="690" width="300" height="110"/><text x="960" y="880" text-anchor="middle" font-size="32" font-weight="600" fill="${GREY}" letter-spacing="2">THE BIG HACK 2026 · RITORNO AL FUTURO REMOTO · CITTÀ DELLA SCIENZA</text></g></g>`;
document.getElementById("stage").innerHTML=H;

// ================= linea del tempo
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const O="50% 50%";
const scene=(id,t0,t1)=>{gsap.set(id,{autoAlpha:0});tl.to(id,{autoAlpha:1,duration:.5},t0);if(t1<62)tl.set(id,{autoAlpha:0},t1+.5);};
const inn=(id,t,o={})=>tl.from(id,Object.assign({autoAlpha:0,y:"+=40",duration:.7,ease:"power3.out"},o),t);
const out=(id,t)=>tl.to(id,{autoAlpha:0,duration:.4},t);
const pop=(id,t)=>tl.from(id,{autoAlpha:0,scale:.3,transformOrigin:O,duration:.6,ease:"back.out(2)"},t);
caps.forEach(([a,b],i)=>{gsap.set("#cap"+i,{autoAlpha:0});tl.fromTo("#cap"+i,{autoAlpha:0,y:20},{autoAlpha:1,y:0,duration:.4},a);tl.to("#cap"+i,{autoAlpha:0,duration:.3},b);});
scene("#gSky",0,36);scene("#gA",0,14);scene("#gH",14,36);scene("#gI",36,46);scene("#gS1",46,50);scene("#gS2",50,54);scene("#gS3",54,58);scene("#gEnd",58,62);
tl.set("#gSky",{autoAlpha:1},0); tl.set("#gA",{autoAlpha:1},0);
tl.to("#cl1",{x:"-=500",duration:36,ease:"none"},0).to("#cl2",{x:"-=700",duration:36,ease:"none"},0).to("#cl3",{x:"-=900",duration:36,ease:"none"},0);
// A
tl.fromTo("#aDrone",{x:-200,y:640},{x:1180,y:560,duration:3.2,ease:"power2.out"},0);
tl.to("#aDrone",{y:"+=14",duration:1,yoyo:true,repeat:9,ease:"sine.inOut"},3.2);
tl.fromTo("#aCloud",{x:2500,y:600},{x:1200,y:610,duration:2.6,ease:"power2.out"},1.6);
inn("#aHead",3.4); out("#aHead",6.8);
gsap.set("#aReg",{autoAlpha:0,scale:.4,transformOrigin:O});
tl.to("#aReg",{autoAlpha:1,scale:1.6,duration:1.2,ease:"power2.out"},7.6).to("#aReg",{scale:2.5,duration:5.2,ease:"none"},8.8);
inn("#bHead",7.2); inn("#aRegT",8.4); inn("#p1",9.0,{x:"-=60",y:"+=0"}); inn("#p2",10.0,{x:"-=60",y:"+=0"}); inn("#p3",11.0,{x:"-=60",y:"+=0"});
// H: 14-18 tempo normale, poi ×0.1
tl.fromTo("#spd",{x:1900},{x:-2200,duration:4,ease:"none"},14).to("#spd",{autoAlpha:0,duration:.3},17.9);
gsap.set("#hReg,#hRegT,#cCam,#cRad,#cWarn,#ring,#tscale,#hStats,#flash,#frag",{autoAlpha:0});
tl.fromTo("#d1",{x:1900,y:980},{x:1040,y:560,duration:4,ease:"power1.in"},14);
tl.fromTo("#d2",{x:200,y:120},{x:960,y:520,duration:4,ease:"power1.in"},14);
tl.to("#hCar",{y:"+=16",duration:1.1,yoyo:true,repeat:19,ease:"sine.inOut"},14);
tl.to("#hJet",{y:"+=10",duration:.9,yoyo:true,repeat:23,ease:"sine.inOut"},14);
pop("#tscale",17.9); tl.set("#tscale",{autoAlpha:1},17.9);
tl.set("#flash",{autoAlpha:1},18).fromTo("#flash",{scale:.2,transformOrigin:O},{scale:5,autoAlpha:0,duration:1.2,ease:"power2.out"},18);
tl.to("#d1",{x:"+=90",y:"+=120",rotation:70,autoAlpha:0,transformOrigin:O,duration:3},18).to("#d2",{x:"-=90",y:"+=140",rotation:-80,autoAlpha:0,transformOrigin:O,duration:3},18);
document.querySelectorAll(".fir").forEach((e,i)=>{gsap.set(e,{scale:0,transformOrigin:O});tl.to(e,{x:+e.dataset.x,y:+e.dataset.y,scale:1.5,duration:2.2,ease:"power2.out"},18+i*.06).to(e,{autoAlpha:0,scale:2,duration:3},20.2);});
document.querySelectorAll(".smk").forEach((e,i)=>{gsap.set(e,{scale:0,transformOrigin:O});tl.to(e,{x:+e.dataset.x,y:+e.dataset.y,scale:+e.dataset.s,duration:9,ease:"power2.out"},18.3+i*.12);});
document.querySelectorAll(".deb").forEach((e)=>{gsap.set(e,{autoAlpha:0});tl.set(e,{autoAlpha:1},18.1).to(e,{x:+e.dataset.x,y:+e.dataset.y,rotation:+e.dataset.r,transformOrigin:O,duration:11,ease:"power1.out"},18.1);});
tl.to("#smokes",{x:160,y:-60,duration:10,ease:"none"},19);
tl.to("#sight",{stroke:"#9AA5B8",autoAlpha:.35,duration:1},20);
pop("#cCam",20.6);tl.set("#cCam",{autoAlpha:1},20.6);pop("#cRad",21.3);tl.set("#cRad",{autoAlpha:1},21.3);
tl.to("#hJet",{autoAlpha:.0,duration:2.5},20.5);
gsap.set("#hReg",{scale:.5,transformOrigin:O});
tl.to("#hReg",{autoAlpha:1,scale:1,duration:1,ease:"back.out(1.6)"},22.8).to("#hReg",{scale:1.5,duration:5.5,ease:"none"},23.8);
inn("#hRegT",23.2);
